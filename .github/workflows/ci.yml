name: GBA Studio CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-rom:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable || npm ci

      - name: Run unit tests
        run: npm test

      - name: Run engine unit tests
        run: make -C appData/engine/gbavm test-unit HOST_CC=gcc

      - name: Run engine integration tests
        run: make -C appData/engine/gbavm test-integration HOST_CC=gcc

      - name: Build CLI
        run: npm run make:cli

      - name: Verify devkitPro GBA toolchain
        run: |
          test "$DEVKITPRO" = "/opt/devkitpro"
          test "$DEVKITARM" = "/opt/devkitpro/devkitARM"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
          test -x "$DEVKITPRO/tools/bin/gbafix"

      - name: Build sample GBA ROM
        run: node out/cli/gb-studio-cli.js make:rom examples/starter-project/project.gbsproj out/GBAStarter.gba

      - name: Build Poachermon end-to-end demo
        run: node out/cli/gb-studio-cli.js make:rom examples/poachermon/project.gbsproj out/Poachermon.gba --verbose

      - name: Build Sunstone Relay isometric end-to-end demo
        run: node out/cli/gb-studio-cli.js make:rom examples/isometric-adventure/project.gbsproj out/SunstoneRelay.gba --verbose

      - name: Build engine ROM
        run: make -C appData/engine/gbavm

      - name: Export sample GBDK project
        run: node out/cli/gb-studio-cli.js export test/data/projects/RunProject/RunProject.gbsproj out/ci/RunProject

      - name: Upload ROM and export artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gba-studio-rom-smoke
          if-no-files-found: ignore
          path: |
            out/GBAStarter.gba
            out/Poachermon.gba
            out/SunstoneRelay.gba
            appData/engine/gbavm/bin/game.gba
            out/ci/RunProject/**

  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable || npm ci

      - name: Fetch engine and tool dependencies
        run: npm run fetch-deps

      - name: Require Windows signing certificate for releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "Release builds require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD repository secrets."
          }

      - name: Prepare Windows signing certificate
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "gba-studio-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" >> $env:GITHUB_ENV

      - name: Verify spaced GBA ROM paths on Windows
        run: npx jest test/compiler/makeBuild.test.ts --runInBand

      - name: Build Windows installer
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run make:win

      - name: Verify Windows signatures
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $files = @(
            Get-ChildItem -Path out -Recurse -Filter "gba-studio.exe"
            Get-ChildItem -Path "out/make/squirrel.windows" -Recurse -Filter "*.exe"
          ) | Sort-Object -Property FullName -Unique
          if ($files.Count -lt 2) {
            throw "Expected both packaged application and installer executables."
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $($file.FullName): $($signature.Status)"
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: gba-studio-windows-installer
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/make/zip/win32/x64/*.zip

  build-linux-installers:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable || npm ci

      - name: Fetch engine and tool dependencies
        run: npm run fetch-deps

      - name: Build Linux installers
        run: npm run make:linux

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: gba-studio-linux-installers
          path: |
            out/make/deb/x64/*.deb
            out/make/rpm/x64/*.rpm
            out/make/AppImage/x64/*.AppImage
            out/make/zip/linux/x64/*.zip

  build-macos-installers:
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable || npm ci

      - name: Fetch engine and tool dependencies
        run: npm run fetch-deps

      - name: Build macOS ARM installers
        env:
          APPLE_ID: ${{ secrets.MAC_NOTARIZE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.MAC_NOTARIZE_PWD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM }}
        run: npm run make:mac

      - name: Build macOS Intel installers
        env:
          APPLE_ID: ${{ secrets.MAC_NOTARIZE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.MAC_NOTARIZE_PWD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM }}
        run: npm run make:mac-intel

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: gba-studio-macos-installers
          path: |
            out/make/*-arm64.dmg
            out/make/*-x64.dmg
            out/make/zip/darwin/arm64/*.zip
            out/make/zip/darwin/x64/*.zip

  attach-release-artifacts:
    needs:
      [build-windows-installer, build-linux-installers, build-macos-installers]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/gba-studio-windows-installer/**
            release-artifacts/gba-studio-linux-installers/**
            release-artifacts/gba-studio-macos-installers/**
