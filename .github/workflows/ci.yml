name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install nested GBA Studio dependencies
        run: npm install --prefix gba-studio

      - name: Fetch dependencies for nested GBA Studio
        run: npm run fetch-deps

      - name: Validate and generate source
        run: npm test

      - name: Build CLI bundle
        run: npm run make:cli

      - name: Install devkitPro GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          curl -L https://github.com/devkitPro/pacman/releases/latest/download/devkitpro-pacman.deb -o /tmp/devkitpro-pacman.deb
          sudo apt-get install -y /tmp/devkitpro-pacman.deb
          sudo dkp-pacman -Sy --noconfirm --needed gba-dev

      - name: Build GBA ROM
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: npm run build:gba -- test/data/projects/RunProject/RunProject.gbsproj out/RunProject.gba

      - name: Validate ROM
        run: npm run validate:rom -- gba-studio/out/RunProject.gba

      - name: Upload GBA ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: runproject-gba
          path: gba-studio/out/RunProject.gba
