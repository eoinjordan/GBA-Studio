name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
      - feat-*
      - beta-*
      - wip-*
      - fix-*

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable || npm ci

      - name: Test
        run: |
          npm test

  deploy:
    needs: test
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/beta-') || startsWith(github.ref, 'refs/heads/feat-') || startsWith(github.ref, 'refs/heads/wip-') || startsWith(github.ref, 'refs/heads/fix-')

    strategy:
      matrix:
        include:
          - name: mac
            label: macOS ARM
            os: macos-14
          - name: mac-intel
            label: macOS Intel
            os: macos-14
          - name: win32
            label: Windows 32-bit
            os: windows-latest
          - name: win64
            label: Windows 64-bit
            os: windows-latest
          - name: linux
            label: Linux
            os: ubuntu-latest
          - name: linux-arm64
            label: Linux-arm64
            os: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Setup codesign certificate
        if: ((matrix.name == 'mac') || (matrix.name == 'mac-intel')) && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 -i - --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain

      - name: Install Dependencies
        run: yarn install --immutable || npm ci

      - name: Prepare Windows signing certificate
        if: (matrix.name == 'win32' || matrix.name == 'win64') && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "gba-studio-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" >> $env:GITHUB_ENV

      - name: Update credits
        if: ${{ vars.FETCH_CREDITS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
        env:
          CREDITS_GITHUB_ACCESS_TOKEN: ${{ secrets.CREDITS_GITHUB_ACCESS_TOKEN }}
        run: |
          npm run fetch-contributors

      # ==== Builds ====

      - name: Build Mac ARM
        if: matrix.name == 'mac'
        env:
          APPLE_ID: ${{ secrets.MAC_NOTARIZE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.MAC_NOTARIZE_PWD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM }}
        run: |
          npm run fetch-deps -- --arch=darwin-arm64
          export APPLE_ID=${APPLE_ID}
          export APPLE_ID_PASSWORD=${APPLE_ID_PASSWORD}
          export APPLE_TEAM_ID=${APPLE_TEAM_ID}        
          npm run make:mac
          mkdir -p ./out/keep
          mv ./out/make/zip/darwin/arm64/*.zip ./out/keep/gb-studio-${GITHUB_REF##*/}-darwin_arm64.zip

      - name: Build Mac Intel
        if: matrix.name == 'mac-intel'
        env:
          APPLE_ID: ${{ secrets.MAC_NOTARIZE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.MAC_NOTARIZE_PWD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM }}
        run: |
          npm run fetch-deps -- --arch=darwin-x64
          export APPLE_ID=${APPLE_ID}
          export APPLE_ID_PASSWORD=${APPLE_ID_PASSWORD}
          export APPLE_TEAM_ID=${APPLE_TEAM_ID}        
          npm run make:mac-intel
          mkdir -p ./out/keep
          mv ./out/make/zip/darwin/x64/*.zip ./out/keep/gb-studio-${GITHUB_REF##*/}-darwin_x64.zip

      - name: Build Linux
        if: matrix.name == 'linux'
        run: |
          npm run fetch-deps -- --arch=linux-x64
          npm run make:linux
          mkdir -p ./out/keep
          mv ./out/make/deb/x64/*.deb ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_x86_64.deb
          mv ./out/make/rpm/x64/*.rpm ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_x86_64.rpm
          mv ./out/make/AppImage/x64/*.AppImage ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_x86_64.AppImage

      - name: Build Linux arm64
        if: matrix.name == 'linux-arm64'
        run: |
          npm run fetch-deps -- --arch=linux-arm64
          cd buildTools/linux-arm64/mod2gbt
          gcc -o mod2gbt ./mod2gbt.c
          cd ../../..          
          npm run make:linux-arm64
          mkdir -p ./out/keep
          mv ./out/make/deb/arm64/*.deb ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_arm64.deb
          mv ./out/make/rpm/arm64/*.rpm ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_arm64.rpm
          mv ./out/make/AppImage/arm64/*.AppImage ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_arm64.AppImage

      - name: Build Win32
        if: matrix.name == 'win32'
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          npm run fetch-deps -- --arch=win32-ia32
          npm run make:win32
          mkdir -p ./out/keep
          mkdir -p ./out/keep/gba-studio-${GITHUB_REF_NAME}-windows_x86-zip
          mv ./out/make/zip/win32/ia32/*.zip ./out/keep/gba-studio-${GITHUB_REF_NAME}-windows_x86-zip/
          mv ./out/make/squirrel.windows/ia32 ./out/keep/gba-studio-${GITHUB_REF_NAME}-windows_x86-squirrel

      - name: Build Win64
        if: matrix.name == 'win64'
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          npm run fetch-deps -- --arch=win32-x64
          npm run make:win
          mkdir -p ./out/keep
          mkdir -p ./out/keep/gba-studio-${GITHUB_REF_NAME}-windows_x86_64-zip
          mv ./out/make/zip/win32/x64/*.zip ./out/keep/gba-studio-${GITHUB_REF_NAME}-windows_x86_64-zip/
          mv ./out/make/squirrel.windows/x64 ./out/keep/gba-studio-${GITHUB_REF_NAME}-windows_x86_64-squirrel

      - name: Verify Windows signatures
        if: (matrix.name == 'win32' || matrix.name == 'win64') && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $files = Get-ChildItem -Path out/keep -Recurse -Filter "*.exe"
          if ($files.Count -lt 1) {
            throw "Expected a signed Windows installer executable."
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $($file.FullName): $($signature.Status)"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }} build
          path: |
            ./out/keep/**
