name: GBA Studio Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pages:
    name: Build browser playground
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable || npm ci

      - name: Test browser player
        run: npm run test:pages

      - name: Validate showcase art budgets
        run: npm run test:showcase-art

      - name: Verify devkitPro GBA toolchain
        run: |
          test "$DEVKITPRO" = "/opt/devkitpro"
          test "$DEVKITARM" = "/opt/devkitpro/devkitARM"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
          test -x "$DEVKITPRO/tools/bin/gbafix"

      - name: Install host test tools
        # The exported-game check compiles the portable engine with mock hardware.
        # These are host tools; the ROM build continues to use devkitARM.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc python3

      - name: Compile browser games
        run: |
          mkdir -p dist/player/roms
          cp -R docs/. dist/
          npm run make:cli
          node out/cli/gb-studio-cli.js make:rom examples/isometric-adventure/project.gbsproj dist/player/roms/isometric-adventure.gba
          node out/cli/gb-studio-cli.js make:rom examples/poachermon/project.gbsproj dist/player/roms/poachermon.gba
          node scripts/write-rom-manifest.js dist/player
          node out/cli/gb-studio-cli.js export examples/isometric-adventure/project.gbsproj out/campaign-sunstone --target gba
          python3 scripts/test-campaign-runtime.py out/campaign-sunstone --sunstone
          node out/cli/gb-studio-cli.js export examples/poachermon/project.gbsproj out/campaign-poachermon --target gba
          python3 scripts/test-campaign-runtime.py out/campaign-poachermon

      - name: Generate coverage report
        run: |
          npm run coverage
          mv coverage/lcov-report dist/coverage

      - name: Generate Storybook
        run: |
          npm run build-storybook
          mv storybook-static dist/storybook

      - name: Validate Pages artifact and ROM headers
        run: npm run validate:pages -- dist

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: gba-studio-pages
          path: dist

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
