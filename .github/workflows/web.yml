name: GBA Studio Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pages:
    name: Build browser playground
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable || npm ci

      - name: Fetch engine and tool dependencies
        run: npm run fetch-deps

      - name: Test browser player
        run: npm run test:pages

      - name: Install devkitPro GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates apt-transport-https
          echo 'deb [trusted=yes] https://apt.devkitpro.org stable main' \
            | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
          sudo apt-get install -y devkitpro-pacman
          sudo dkp-pacman -Sy --needed --noconfirm gba-dev
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc --version

      - name: Build static site
        run: |
          mkdir -p dist/player/roms
          cp -R docs/. dist/
          npm run make:cli
          node out/cli/gb-studio-cli.js make:rom examples/starter-project/project.gbsproj dist/player/roms/gba-starter.gba
          node out/cli/gb-studio-cli.js make:rom examples/isometric-adventure/project.gbsproj dist/player/roms/isometric-adventure.gba

      - name: Generate coverage report
        run: |
          npm run coverage
          mv coverage/lcov-report dist/coverage

      - name: Generate Storybook
        run: |
          npm run build-storybook
          mv storybook-static dist/storybook

      - name: Validate Pages artifact and ROM headers
        run: npm run validate:pages -- dist

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: gba-studio-pages
          path: dist

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
