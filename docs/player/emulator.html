<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GBA Studio emulator</title>
    <style>
      html,
      body,
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05060a;
      }

      body {
        display: grid;
        place-items: stretch;
        color: #f5f3ff;
        font: 14px system-ui, sans-serif;
      }

      .error {
        margin: auto;
        padding: 24px;
        color: #ffb4b4;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const rom = params.get("rom");
        const name = params.get("name") || "GBA Studio game";
        if (!rom) {
          document.getElementById("game").innerHTML =
            '<p class="error">No GBA ROM was selected.</p>';
          return;
        }

        window.EJS_player = "#game";
        window.EJS_core = "gba";
        window.EJS_controlScheme = "gba";
        window.EJS_gameUrl = rom;
        window.EJS_gameName = name;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_color = "#8b5cf6";
        window.EJS_startOnLoaded = true;
        window.EJS_AdUrl = "";
        window.EJS_AdTimer = -1;

        const loader = document.createElement("script");
        loader.src = window.EJS_pathtodata + "loader.js";
        loader.onerror = function () {
          document.getElementById("game").innerHTML =
            '<p class="error">The emulator could not be loaded. Check your connection and try again.</p>';
        };
        document.body.appendChild(loader);
      })();
    </script>
  </body>
</html>
