<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GBA Studio emulator</title>
    <style>
      html,
      body,
      #shell,
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05060a;
      }

      body {
        display: flex;
        flex-direction: column;
        color: #f5f3ff;
        font:
          14px system-ui,
          sans-serif;
      }

      #shell {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      #game-controls {
        display: flex;
        justify-content: center;
        gap: 6px;
        padding: 6px;
        background: #101323;
      }

      #game-controls button {
        min-width: 40px;
        min-height: 36px;
        border: 1px solid #8068b8;
        border-radius: 6px;
        color: #f5f3ff;
        background: #29203f;
        touch-action: none;
        cursor: pointer;
      }

      #game-controls button:focus-visible {
        outline: 2px solid #d9f99d;
      }

      .boot-status {
        position: absolute;
        z-index: 20;
        top: 14px;
        left: 50%;
        max-width: calc(100% - 32px);
        padding: 8px 12px;
        transform: translateX(-50%);
        border: 1px solid rgba(196, 181, 253, 0.45);
        border-radius: 999px;
        background: rgba(10, 11, 18, 0.9);
        color: #ede9fe;
        font-size: 12px;
        text-align: center;
        cursor: pointer;
      }

      .boot-status:disabled {
        cursor: wait;
      }

      .boot-status.ready {
        border-color: rgba(217, 249, 157, 0.55);
        color: #d9f99d;
      }

      .boot-status.error {
        border-color: rgba(255, 180, 180, 0.65);
        color: #ffb4b4;
      }

      .error {
        margin: auto;
        padding: 24px;
        color: #ffb4b4;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="game"></div>
      <button class="boot-status" id="boot-status" type="button" disabled>
        Loading emulator controls…
      </button>
    </div>
    <div id="game-controls" aria-label="Game buttons">
      <button type="button" data-input="4" aria-label="Move up" disabled>
        ↑
      </button>
      <button type="button" data-input="5" aria-label="Move down" disabled>
        ↓
      </button>
      <button type="button" data-input="6" aria-label="Move left" disabled>
        ←
      </button>
      <button type="button" data-input="7" aria-label="Move right" disabled>
        →
      </button>
      <button
        type="button"
        data-input="8"
        aria-label="A: interact or advance"
        disabled
      >
        A
      </button>
      <button type="button" data-input="0" aria-label="B" disabled>B</button>
      <button type="button" data-input="3" aria-label="Start" disabled>
        Start
      </button>
    </div>
    <script src="player.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const rom = params.get("rom");
        const name = params.get("name") || "GBA Studio game";
        const bootStatus = document.getElementById("boot-status");
        const report = function (type, message) {
          window.parent.postMessage(
            { source: "gba-studio-emulator", type: type, message: message },
            window.location.origin,
          );
        };
        const showError = function (message) {
          bootStatus.textContent = message;
          bootStatus.disabled = true;
          bootStatus.classList.add("error");
          report("error", message);
        };
        if (!rom) {
          showError("No GBA ROM was selected.");
          return;
        }

        window.EJS_player = "#game";
        window.EJS_core = "gba";
        window.EJS_controlScheme = "gba";
        window.EJS_defaultControls = window.GBAStudioPlayer.CONTROLS;
        window.EJS_gameUrl = rom;
        window.EJS_gameName = name;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/4.2.3/data/";
        window.EJS_color = "#8b5cf6";
        // EmulatorJS documents that startOnLoaded can freeze until the user
        // interacts with the page. Keep the explicit Play button so direct
        // links and demo-card launches work reliably in every browser.
        window.EJS_startOnLoaded = false;
        window.EJS_startButtonName = "Play GBA Studio Game";
        window.EJS_backgroundColor = "#0f172a";
        window.EJS_AdUrl = "";
        window.EJS_AdTimer = -1;
        window.EJS_ready = function () {
          bootStatus.textContent = "Play GBA Studio Game";
          bootStatus.disabled = false;
          bootStatus.classList.add("ready");
          report("ready", bootStatus.textContent);
        };
        window.EJS_onGameStart = function () {
          bootStatus.hidden = true;
          document
            .querySelectorAll("#game-controls button")
            .forEach(function (button) {
              button.disabled = false;
            });
          const canvas = document.querySelector("#game canvas");
          if (canvas) {
            canvas.tabIndex = 0;
            canvas.setAttribute("aria-label", name + " game screen");
            canvas.focus();
          }
          report("started", "Game running");
        };

        // Button taps last long enough for a game frame to sample them.
        // Pointer holds support continuous movement; keyboard activation taps.
        document
          .querySelectorAll("#game-controls button")
          .forEach(function (button) {
            const input = Number(button.dataset.input);
            let pressedAt = 0;
            let releaseTimer = null;
            let pointerTap = false;
            const press = function () {
              window.clearTimeout(releaseTimer);
              pressedAt = performance.now();
              window.EJS_emulator.gameManager.simulateInput(0, input, 1);
            };
            const release = function () {
              releaseTimer = window.setTimeout(
                function () {
                  window.EJS_emulator.gameManager.simulateInput(0, input, 0);
                },
                Math.max(0, 100 - (performance.now() - pressedAt)),
              );
            };
            button.addEventListener("pointerdown", function (event) {
              pointerTap = true;
              button.setPointerCapture(event.pointerId);
              press();
            });
            button.addEventListener("pointerup", release);
            button.addEventListener("pointercancel", release);
            button.addEventListener("click", function () {
              if (pointerTap) {
                pointerTap = false;
                return;
              }
              press();
              release();
            });
          });

        bootStatus.addEventListener("click", function () {
          const startButton = document.querySelector(".ejs_start_button");
          if (startButton) {
            bootStatus.disabled = true;
            bootStatus.textContent = "Starting game…";
            startButton.click();
          }
        });

        window.setTimeout(function () {
          if (!bootStatus.hidden && !bootStatus.classList.contains("ready")) {
            bootStatus.textContent =
              "Still downloading the mGBA core… check your connection if this continues.";
          }
        }, 15000);

        const loader = document.createElement("script");
        loader.src = window.EJS_pathtodata + "loader.js";
        loader.onerror = function () {
          showError(
            "The emulator could not be loaded. Check your connection and try again.",
          );
        };
        document.body.appendChild(loader);
      })();
    </script>
  </body>
</html>
